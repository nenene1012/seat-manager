<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="席管理">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>座席利用時間管理</title>
<style>
:root{--bg:#f3f5f7;--panel:#fff;--ink:#18202a;--muted:#6c7682;--line:#d9dee5;--accent:#2563eb;--busy:#f8dce6;--free:#ccecf8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}
.app{min-height:100dvh;display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:12px;padding:12px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 4px 18px #0000000c}
.left,.right{display:flex;flex-direction:column;min-width:0}
.head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line)}
h1,h2{font-size:20px;margin:0}.hint{font-size:12px;color:var(--muted)}
.map-wrap{flex:1;display:grid;place-items:center;padding:15px;min-height:0}
.map{width:min(100%,76vh);aspect-ratio:1/1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(6,1fr);column-gap:8px;row-gap:6px}
.seat,.gap,.register{min-width:0;min-height:0}
.seat{border:2px solid #aeb7c2;border-radius:3px;background:var(--free);padding:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.seat.busy{background:var(--busy);border-color:#d99aae}
.seatno{font-size:clamp(18px,2.15vw,31px);font-weight:850;line-height:1}
.meta,.until{font-size:clamp(10px,1.05vw,15px);font-weight:750;margin-top:5px;white-space:nowrap}
.empty{font-size:11px;color:#728078;margin-top:5px}
.gap{background:transparent}
.register{border:2px solid #343b44;border-radius:3px;background:#e3e6ea;display:flex;align-items:center;justify-content:center;font-weight:850;color:#3c4650}
/* 通路: 6-5、4-3、2-1 の間 */
.map > :nth-child(n+1):nth-child(-n+4),
.map > :nth-child(n+9):nth-child(-n+12),
.map > :nth-child(n+17):nth-child(-n+20){margin-bottom:18px}
.map > :nth-child(n+5):nth-child(-n+8),
.map > :nth-child(n+13):nth-child(-n+16),
.map > :nth-child(n+21):nth-child(-n+24){margin-top:18px}
.listhead,.row{display:grid;grid-template-columns:.65fr 1fr 1fr;align-items:center}
.listhead{padding:10px 15px;color:var(--muted);font-size:12px;font-weight:800;border-bottom:1px solid var(--line)}
.queue{overflow:auto;flex:1}.row{padding:13px 15px;border-bottom:1px solid #edf0f3;font-size:16px}
.row .num,.row .time{font-weight:850}.row .num{font-size:20px}.none{padding:28px 16px;text-align:center;color:var(--muted)}
.footer{padding:9px 15px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.dialog-overlay{display:none;position:fixed;inset:0;z-index:9999;background:#0006;align-items:center;justify-content:center;padding:16px}.dialog-overlay.open{display:flex}.dialog-box{background:#fff;border-radius:16px;width:min(92vw,450px);max-height:92vh;overflow:auto;box-shadow:0 25px 80px #0005}
.modal{padding:20px}.modal h3{font-size:23px;margin:0 0 15px}
.fieldlabel{display:block;font-size:13px;font-weight:800;color:#56616e;margin:13px 0 6px}
input[type=time],input[type=number],select{width:100%;font-size:20px;padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff}
.courses{display:grid;grid-template-columns:1fr 1fr;gap:7px}.course{border:1px solid var(--line);border-radius:7px;padding:10px;cursor:pointer;background:#fff;font-weight:750}.course input{margin-right:6px}
.preview{margin-top:13px;background:#f5f7fa;border-radius:8px;padding:12px;font-weight:800;min-height:45px}
.linknote{font-size:12px;color:var(--muted);margin-top:6px}
.seat.grouped{background:#eef8f0;border-color:#9bc7a4;box-shadow:inset 0 0 0 3px #9bc7a4}
.groupmark{font-size:10px;font-weight:850;margin-top:3px}
.row.grouped{border-left:6px solid #9bc7a4;background:#f2faf4}
.actions{display:flex;gap:7px;margin-top:15px}.actions button{border:0;border-radius:8px;padding:12px 13px;cursor:pointer;font-weight:850}
.primary{background:var(--accent);color:#fff;flex:1}.secondary{background:#edf0f4}.danger{background:#fee9e9;color:#a71919}
@media(max-width:760px){
 .app{grid-template-columns:1fr;min-height:100dvh}
 .map{width:100%;max-width:650px}
 .right{min-height:360px}
}
</style>
</head>
<body>
<div class="app">
<section class="panel left">
 <div class="head"><h1>席状況</h1><div class="hint">席をタップして登録</div></div>
 <div class="map-wrap"><div class="map" id="map">
  <button class="seat" data-seat="63"><b class="seatno">63</b><span class="empty">空席</span></button><div class="gap"></div><button class="seat" data-seat="62"><b class="seatno">62</b><span class="empty">空席</span></button><button class="seat" data-seat="61"><b class="seatno">61</b><span class="empty">空席</span></button>
  <button class="seat" data-seat="54"><b class="seatno">54</b><span class="empty">空席</span></button><button class="seat" data-seat="53"><b class="seatno">53</b><span class="empty">空席</span></button><button class="seat" data-seat="52"><b class="seatno">52</b><span class="empty">空席</span></button><button class="seat" data-seat="51"><b class="seatno">51</b><span class="empty">空席</span></button>
  <button class="seat" data-seat="44"><b class="seatno">44</b><span class="empty">空席</span></button><button class="seat" data-seat="43"><b class="seatno">43</b><span class="empty">空席</span></button><button class="seat" data-seat="42"><b class="seatno">42</b><span class="empty">空席</span></button><button class="seat" data-seat="41"><b class="seatno">41</b><span class="empty">空席</span></button>
  <button class="seat" data-seat="34"><b class="seatno">34</b><span class="empty">空席</span></button><button class="seat" data-seat="33"><b class="seatno">33</b><span class="empty">空席</span></button><button class="seat" data-seat="32"><b class="seatno">32</b><span class="empty">空席</span></button><button class="seat" data-seat="31"><b class="seatno">31</b><span class="empty">空席</span></button>
  <button class="seat" data-seat="23"><b class="seatno">23</b><span class="empty">空席</span></button><div class="gap"></div><button class="seat" data-seat="22"><b class="seatno">22</b><span class="empty">空席</span></button><button class="seat" data-seat="21"><b class="seatno">21</b><span class="empty">空席</span></button>
  <button class="seat" data-seat="13"><b class="seatno">13</b><span class="empty">空席</span></button><button class="seat" data-seat="12"><b class="seatno">12</b><span class="empty">空席</span></button><button class="seat" data-seat="11"><b class="seatno">11</b><span class="empty">空席</span></button><div class="register">レジ</div>
 </div></div>
</section>
<aside class="panel right">
 <div class="head"><h2>次に空く席</h2><div class="hint" id="count">使用中 0卓</div></div>
 <div class="listhead"><span>席</span><span>コース</span><span>退席時刻</span></div>
 <div class="queue" id="queue"><div class="none">現在、終了時刻が登録された席はありません</div></div>
 <div class="footer">空く予定が早い順に自動表示</div>
</aside>
</div>

<div id="dlg" class="dialog-overlay"><div class="dialog-box"><form class="modal" id="form">
 <h3 id="title">席</h3>
 <label class="fieldlabel" for="start">コーススタート</label><input id="start" type="time" required>
 <span class="fieldlabel">コース</span>
 <div class="courses">
  <label class="course"><input type="radio" name="course" value="ST" checked>ST　スタンダード</label>
  <label class="course"><input type="radio" name="course" value="SUSHI">🍣　寿司</label>
  <label class="course"><input type="radio" name="course" value="SP">SP　スペシャル</label>
  <label class="course"><input type="radio" name="course" value="CHEESE">🧀　チーズ三昧</label>
  <label class="course"><input type="radio" name="course" value="P">P　プレミアム</label>
 </div>
 <label class="fieldlabel" for="extend">延長時間（分）</label>
  <input id="extend" type="number" min="0" step="1" inputmode="numeric" value="0" placeholder="例：20">
  <label class="fieldlabel" for="linked">同じ卓として紐づける席</label>
  <select id="linked"><option value="">なし</option></select>
  <div class="linknote">同じタブレットでコース選択している席を指定できます。</div>
  <div class="preview" id="preview"></div>
 <div class="actions"><button type="button" class="secondary" id="cancel">キャンセル</button><button type="button" class="danger" id="clear">退席</button><button class="primary" type="submit">登録</button></div>
</form></div></div>

<script>
(function(){
"use strict";

const defs={
 ST:{short:"ST",min:80},
 SUSHI:{short:"🍣",min:100},
 SP:{short:"SP",min:120},
 CHEESE:{short:"🧀",min:null},
 P:{short:"P",min:null}
};
const STORAGE_KEY="seat-manager-pwa-v3";
const OLD_KEYS=["seat-manager-pwa-v2","seat-manager-pwa-v1"];
const colors=["#60a5fa"];
let state={},selected=null;

function load(){
 let raw=localStorage.getItem(STORAGE_KEY);
 if(!raw){for(const k of OLD_KEYS){raw=localStorage.getItem(k);if(raw)break}}
 try{state=raw?JSON.parse(raw):{}}catch(e){state={}}
}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}}
function $(s){return document.querySelector(s)}
function $$(s){return Array.from(document.querySelectorAll(s))}
function pad(n){return String(n).padStart(2,"0")}
function toMin(t){const a=t.split(":").map(Number);return a[0]*60+a[1]}
function fmt(m){return pad(Math.floor((m%1440)/60))+":"+pad(m%60)}
function now(){const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())}

function calc(start,course,extend){
 const s=toMin(start),meal=s<960?"L":"D",def=defs[course];
 extend=Math.max(0,Number(extend)||0);
 let end;
 if(def.min===null){
   // 🧀 / P
   // L: 2時間後が16:00を超える場合は2時間制。それ以前なら16:00まで。
   // D: 21:00まで。
   end=meal==="L" ? ((s+120>960)?s+120:960) : 1260;
   end+=extend;
 }else{
   end=s+def.min+extend;
 }
 return {meal:meal,end:end};
}

function members(no){
 const d=state[no];
 if(!d)return [];
 if(!d.groupId)return [no];
 return Object.keys(state).filter(n=>state[n]&&state[n].groupId===d.groupId);
}
function color(gid){
 let n=0;
 for(let i=0;i<gid.length;i++)n+=gid.charCodeAt(i);
 return colors[n%colors.length];
}
function closeModal(){$("#dlg").classList.remove("open")}
function openModal(){$("#dlg").classList.add("open")}

function fillLinked(no){
 const sel=$("#linked");
 sel.innerHTML='<option value="">なし</option>';
 $$(".seat").forEach(function(b){
   const n=b.dataset.seat;
   if(n===no)return;
   const o=document.createElement("option");
   o.value=n;
   o.textContent=n+(state[n]?"（使用中）":"");
   sel.appendChild(o);
 });
}

function preview(){
 const r=$('input[name="course"]:checked');
 const start=$("#start").value;
 if(!r||!start)return;
 const ext=Math.max(0,Number($("#extend").value)||0);
 const x=calc(start,r.value,ext);
 const linked=$("#linked").value;
 $("#preview").textContent=x.meal+" / "+defs[r.value].short+" → "+fmt(x.end)+" まで"+
   (ext>0?"（+"+ext+"分）":"")+(linked?"　同卓："+selected+"・"+linked:"");
}

function openSeat(no){
 selected=no;
 const d=state[no];
 $("#title").textContent=no+"卓";
 $("#start").value=d?d.start:now();
 $("#extend").value=d?(d.extend||0):0;
 const course=d?d.course:"ST";
 const radio=$('input[name="course"][value="'+course+'"]');
 if(radio)radio.checked=true;
 fillLinked(no);
 const ms=d?members(no):[];
 $("#linked").value=ms.length>1?(ms.find(n=>n!==no)||""):"";
 $("#clear").style.display=d?"block":"none";
 preview();
 openModal();
}

function render(){
 $$(".seat").forEach(function(b){
   const no=b.dataset.seat,d=state[no];
   b.className="seat"+(d?" busy":"")+(d&&d.groupId?" grouped":"");
   b.style.removeProperty("--group-color");
   if(!d){
     b.innerHTML='<b class="seatno">'+no+'</b><span class="empty">空席</span>';
     return;
   }
   const x=calc(d.start,d.course,d.extend),ms=members(no);
   if(d.groupId)b.style.setProperty("--group-color",color(d.groupId));
   b.innerHTML='<b class="seatno">'+no+'</b>'+
     '<span class="meta">'+x.meal+' / '+defs[d.course].short+'</span>'+
     '<span class="until">'+fmt(x.end)+'迄</span>'+
     (Number(d.extend)>0?'<span class="groupmark">+'+d.extend+'分</span>':'')+
     (ms.length>1?'<span class="groupmark">同卓 '+ms.join("・")+'</span>':'');
 });

 const seen=new Set(),rows=[];
 Object.keys(state).forEach(function(no){
   const d=state[no],gid=d.groupId||("solo-"+no);
   if(seen.has(gid))return;
   seen.add(gid);
   const ms=d.groupId?members(no):[no],x=calc(d.start,d.course,d.extend);
   rows.push({no:no,d:d,gid:gid,ms:ms,x:x});
 });
 rows.sort((a,b)=>a.x.end-b.x.end||Number(a.no)-Number(b.no));

 $("#queue").innerHTML=rows.length?rows.map(function(r){
   return '<div class="row'+(r.ms.length>1?' grouped':'')+'"'+
     (r.ms.length>1?' style="--group-color:'+color(r.gid)+'"':'')+'>'+
     '<span class="num">'+r.ms.join("・")+'</span>'+
     '<span>'+r.x.meal+' / '+defs[r.d.course].short+(Number(r.d.extend)>0?' +'+r.d.extend+'分':'')+'</span>'+
     '<span class="time">'+fmt(r.x.end)+'</span></div>';
 }).join(""):'<div class="none">現在、終了時刻が登録された席はありません</div>';

 const groups=new Set(Object.keys(state).map(n=>state[n].groupId||("solo-"+n)));
 $("#count").textContent="使用中 "+groups.size+"卓";
}

function init(){
 load();
 $("#map").addEventListener("click",function(e){
   const b=e.target.closest(".seat");
   if(b)openSeat(b.dataset.seat);
 });
 $("#cancel").addEventListener("click",closeModal);
 $("#dlg").addEventListener("click",function(e){if(e.target===this)closeModal()});
 $("#start").addEventListener("input",preview);
 $("#extend").addEventListener("input",preview);
 $("#linked").addEventListener("change",preview);
 $$(".course input").forEach(r=>r.addEventListener("change",preview));

 $("#clear").addEventListener("click",function(){
   const ms=members(selected);
   if(ms.length>1){
     if(confirm(ms.join("・")+" は同じ卓です。まとめて退席にしますか？")){
       ms.forEach(n=>delete state[n]);
     }else{
       delete state[selected];
       ms.filter(n=>n!==selected).forEach(n=>{if(state[n])state[n].groupId=null});
     }
   }else delete state[selected];
   save();closeModal();render();
 });

 $("#form").addEventListener("submit",function(e){
   e.preventDefault();
   const r=$('input[name="course"]:checked');
   if(!r)return;
   const start=$("#start").value,course=r.value;
   const extend=Math.max(0,Number($("#extend").value)||0);
   const linked=$("#linked").value;

   const old=members(selected);
   old.filter(n=>n!==selected).forEach(n=>{if(state[n])state[n].groupId=null});

   if(linked){
     const lm=state[linked]?members(linked):[linked];
     const gid=(state[linked]&&state[linked].groupId)||("g-"+Date.now()+"-"+selected+"-"+linked);
     Array.from(new Set([selected].concat(lm))).forEach(function(n){
       state[n]={start:start,course:course,extend:extend,groupId:gid};
     });
   }else{
     state[selected]={start:start,course:course,extend:extend,groupId:null};
   }
   save();closeModal();render();
 });

 render();
}

if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);
else init();

if("serviceWorker" in navigator){
 window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})});
}
})();
</script>
</body></html>
